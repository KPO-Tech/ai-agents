[project]
name = "invoice-agent"
version = "0.1.0"
description = "Un agent IA minimal qui trie des factures (projet de la vidéo KPO-TECH)"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
invoice-agent = "invoice_agent.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
